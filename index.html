<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />

    <!-- Browser toolbar colour on mobile -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1419" media="(prefers-color-scheme: dark)" />

    <!-- Primary SEO -->
    <title>Robin Heij — Creative Front-end Developer</title>
    <meta name="description" content="Senior creative front-end developer with a design background and leadership experience. Available from September 2026 through Team Rockstars IT." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://robinheij.nl" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://robinheij.nl" />
    <meta property="og:site_name" content="Robin Heij" />
    <meta property="og:title" content="Robin Heij — Creative Front-end Developer" />
    <meta property="og:description" content="Senior creative front-end developer with a design background and leadership experience. Available from September 2026 through Team Rockstars IT." />
    <meta property="og:image" content="https://robinheij.nl/robin.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="837" />
    <meta property="og:image:alt" content="Robin Heij — Creative Front-end Developer" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robin Heij — Creative Front-end Developer" />
    <meta name="twitter:description" content="Senior creative front-end developer with a design background and leadership experience. Available from September 2026 through Team Rockstars IT." />
    <meta name="twitter:image" content="https://robinheij.nl/robin.jpg" />
    <meta name="twitter:image:alt" content="Robin Heij — Creative Front-end Developer" />

    <!-- Geist Font -->
    <style>
      @import url('https://cdn.jsdelivr.net/npm/@vercel/style-guide@5.0.0/fonts/geist.css');

      :root {
        --font-geist-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        --font-geist-mono: "Geist Mono", "SF Mono", Monaco, Inconsolata, "Roboto Mono", Consolas, "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
